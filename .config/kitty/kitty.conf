font_family JetBrains Mono
font_size 14
bold_font auto
italic_font auto
bold_italic_font auto

cursor_blink_interval 0
shell_integration no-cursor

foreground #E8E8E8
background #010203
selection_foreground #010203
selection_background #6495ED

cursor #6495ED
cursor_text_color #0A0B0E

url_color #52FFF8

active_border_color #88C1FF
inactive_border_color #3A5FCD
bell_border_color #FFFF66

wayland_titlebar_color system
macos_titlebar_color system

active_tab_foreground #010203
active_tab_background #6495ED
inactive_tab_foreground #888888
inactive_tab_background #1A1A1A
tab_bar_background #0A0B0E

mark1_foreground #0A0B0E
mark1_background #6495ED
mark2_foreground #0A0B0E
mark2_background #FFFF66
mark3_foreground #0A0B0E
mark3_background #52FFF8

color0 #010203
color8 #2A2A2B

color1 #F7635D
color9 #FF8888

color2 #3DD553
color10 #5AFF7A

color3 #FFFF66
color11 #FFFF99

color4 #6495ED
color12 #88C1FF

color5 #F5BDE6
color13 #FFD6F5

color6 #52FFF8
color14 #7AFFFF

color7 #D0D0D0
color15 #FFFFFF

window_padding_width 0 0 0

map ctrl+shift+enter new_os_window_with_cwd

enable_audio_bell no
window_alert_on_bell no

background_opacity 0.95
dynamic_background_opacity yes

visual_bell_duration 0.1
visual_bell_color #FFFF66

underline_hyperlinks hover
url_style curly

tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{title}"

dim_opacity 0.3

cursor_shape beam
cursor_beam_thickness 1.5

adjust_line_height 0
adjust_column_width 0
