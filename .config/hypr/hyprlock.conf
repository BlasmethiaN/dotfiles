general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(010203ee)
}

label {
    monitor =
    text = $TIME
    color = rgb(ffff66)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
    shadow_passes = 2
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(6495ed)
    inner_color = rgb(010203)
    font_color = rgb(ffff66)
    fade_on_empty = false
    placeholder_text = <i>ACCESS CODE</i>
    position = 0, -80
    halign = center
    valign = center
}
